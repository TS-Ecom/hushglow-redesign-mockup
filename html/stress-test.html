<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HUSH GLOW — layout stress test</title>
<!-- Internal tool, not a page of the site: kept self-contained on purpose so it never
     pulls the site's shared.css into the measurements. Loads a page in an iframe at a
     set width, multiplies every font-size the way Android's text-scaling setting does
     (font grows, containers do not), and reports what breaks. -->
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#111;color:#eee;font-size:14px;line-height:1.5}
  header{position:sticky;top:0;z-index:5;background:#181818;border-bottom:1px solid #333;padding:14px 18px;display:flex;gap:18px;align-items:center;flex-wrap:wrap}
  h1{font-size:15px;font-weight:600;letter-spacing:.02em}
  label{display:flex;gap:6px;align-items:center;font-size:13px;color:#bbb}
  select,button{font:inherit;background:#262626;color:#eee;border:1px solid #3a3a3a;border-radius:4px;padding:6px 10px;cursor:pointer}
  button.run{background:#2f6b3a;border-color:#2f6b3a;font-weight:600}
  .frames{display:flex;gap:16px;padding:18px;overflow-x:auto;align-items:flex-start}
  .cell{flex:none}
  .cell h2{font-size:12px;color:#9a9a9a;margin-bottom:6px;font-weight:500}
  .cell iframe{border:1px solid #333;background:#fff;height:760px;display:block}
  #out{padding:0 18px 40px;max-width:1100px}
  #out h3{font-size:14px;margin:18px 0 8px;color:#fff}
  table{border-collapse:collapse;width:100%;font-size:12.5px}
  th,td{border-bottom:1px solid #2c2c2c;padding:6px 8px;text-align:left;vertical-align:top}
  th{color:#9a9a9a;font-weight:500}
  td.sel{font-family:ui-monospace,Menlo,monospace;color:#9ecbff}
  .bad{color:#ff8080}
  .warn{color:#ffcf72}
  .ok{color:#8fd694}
  .note{color:#9a9a9a;font-size:12.5px;margin-top:6px}
</style>
</head>
<body>

<header>
  <h1>Layout stress test</h1>
  <label>Page
    <select id="page">
      <option value="__all__">&#9654; All 27 pages</option>
      <optgroup label="Home &amp; collections">
        <option value="index.html">Home</option>
        <option value="page-collection-all.html">Collection &mdash; Shop All</option>
        <option value="page-collection-face-makeup.html">Collection &mdash; Face Makeup</option>
        <option value="page-collection-bundles-sets.html">Collection &mdash; Bundles &amp; Sets</option>
      </optgroup>
      <optgroup label="Products">
        <option value="product-hush-foundation-cushion.html">Foundation Cushion</option>
        <option value="product-blush-stick.html">Multi-Effect Blush Stick</option>
        <option value="product-hydrating-concealer.html">Hydrating Concealer Stick</option>
        <option value="product-pore-blurring-primer-stick.html">Pore-Blurring Primer Stick</option>
        <option value="product-waterproof-setting-spray.html">Waterproof Setting Spray</option>
        <option value="product-glow-travel-kit.html">Glow Travel Kit</option>
        <option value="product-perfect-base-bundle.html">Perfect Base Bundle</option>
        <option value="product-all-day-glow-bundle.html">All Day Glow Bundle</option>
        <option value="product-sunkissed-trio.html">Sunkissed Trio</option>
      </optgroup>
      <optgroup label="Get the look">
        <option value="page-gulya-s-berry-toned-glow.html">Gulya &mdash; Berry-Toned Glow</option>
        <option value="page-nina-s-sculpted-clean-look.html">Nina &mdash; Sculpted &amp; Clean</option>
        <option value="page-daria-s-barely-there-beauty.html">Daria &mdash; Barely-There</option>
        <option value="page-olga-s-soft-warmth-look.html">Olga &mdash; Soft Warmth</option>
        <option value="page-phoebe-s-bold-draped-flush.html">Phoebe &mdash; Bold Draped Flush</option>
        <option value="page-asteria-s-fresh-pop-look.html">Asteria &mdash; Fresh Pop</option>
      </optgroup>
      <optgroup label="Static pages">
        <option value="page-makeup-quizzes.html">Makeup Quizzes (hub)</option>
        <option value="page-about-us.html">About Us</option>
        <option value="page-contact.html">Contact</option>
      </optgroup>
      <optgroup label="Policies">
        <option value="page-terms-of-service.html">Terms of Service</option>
        <option value="page-privacy-policy.html">Privacy Policy</option>
        <option value="page-shipping-policy.html">Shipping Policy</option>
        <option value="page-refund-policy.html">Refund Policy</option>
        <option value="page-subscription-policy.html">Subscription Policy</option>
      </optgroup>
    </select>
  </label>
  <label>Widths
    <select id="widths">
      <option value="390,1440" selected>390 / 1440 (phone + desktop)</option>
      <option value="320,360,375,390,430">320 / 360 / 375 / 390 / 430</option>
      <option value="360,375,390">360 / 375 / 390</option>
      <option value="390">390 only (the width the pages are drawn at)</option>
      <option value="375">375 only (iPhone SE, 8, mini)</option>
      <option value="360">360 only (most Android)</option>
      <option value="320">320 only</option>
      <option value="1024,1440">1024 / 1440 (desktop)</option>
    </select>
  </label>
  <label>Font scale
    <select id="scale">
      <option value="1">100%</option>
      <option value="1.3" selected>130% (typical for this audience)</option>
      <option value="1.75">175%</option>
      <option value="2">200%</option>
    </select>
  </label>
  <label><input type="checkbox" id="bold"> Bold text</label>
  <button class="run" id="run">Run audit</button>
</header>

<div class="frames" id="frames"></div>
<div id="out"></div>

<script>
/* Android scales the font only, so the emulation walks the tree and multiplies each
   computed font-size in place. Zooming the iframe would scale boxes too and hide
   exactly the failures we are looking for. */
function applyScale (doc, k, bold) {
  if (k === 1 && !bold) return;
  /* Read every computed size FIRST, then write. Reading and writing in the same pass
     re-multiplies nested elements, because by the time a child is measured its parent
     has already been enlarged: a node five levels deep ends up at k^5, not k. That is
     not what a phone does; Android scales the base size once and inheritance does the
     rest. */
  var nodes = Array.prototype.slice.call(doc.querySelectorAll('*'));
  var sizes = nodes.map(function (el) {
    var cs = doc.defaultView.getComputedStyle(el);
    return { fs: parseFloat(cs.fontSize), fw: parseInt(cs.fontWeight, 10) || 400 };
  });
  nodes.forEach(function (el, i) {
    if (k !== 1 && sizes[i].fs) el.style.fontSize = (sizes[i].fs * k) + 'px';
    if (bold) el.style.fontWeight = Math.min(900, sizes[i].fw + 300);
  });
}

/* A node counts as broken when its own content does not fit the box it was given, or
   when it sticks out of the viewport. Scrollable rails (sliders, thumb rows) are
   skipped: overflowing is what they are for. */
function audit (win, width) {
  var doc = win.document;
  var rails = ['.thumbs', '.vrow', '.bsrow', '.trow', '.grid3', '.grid4', '.recrow', '.stepgrid',
               '.shgrid', '.cylrow', '.mm-mtiles', '.ticker', '.pstrip', '.rcards',
               '.gmain', '.shgal__strip', '.cmptab__rows',
               /* home page: the press marquee and the looping Get-the-Look carousel are
                  built to run wider than the screen, and the Instagram embed is a
                  third-party widget that scrolls itself */
               '.press', '.look', '.lookrow', '[class*="eapps-"]',
               '.recrow', '.statrow',
               /* the collection switcher is swiped on a phone, like every other rail */
               '.collswitch'];
  /* panels that live off-screen until opened would otherwise report as broken layout */
  var offstage = ['.cartdrawer', '.cart-ovl', '.mobmenu', '.mm-panel', '.satc',
                  '.shgal__detail', '.shgal__backdrop'];
  var isRail = function (el) { return rails.some(function (s) { return el.closest(s); }); };
  var isOffstage = function (el) { return offstage.some(function (s) { return el.closest(s); }); };

  var issues = [];
  var seen = new Set();
  var push = function (type, el, detail) {
    var sel = el.tagName.toLowerCase() + (el.className && typeof el.className === 'string' ? '.' + el.className.trim().split(/\s+/).slice(0, 2).join('.') : '');
    var key = type + '|' + sel;
    if (seen.has(key)) return;
    seen.add(key);
    issues.push({ type: type, sel: sel, detail: detail, text: (el.textContent || '').trim().slice(0, 46) });
  };

  doc.querySelectorAll('body *').forEach(function (el) {
    var cs = win.getComputedStyle(el);
    if (cs.display === 'none' || cs.visibility === 'hidden' || cs.opacity === '0') return;
    if (isOffstage(el) || isRail(el)) return;
    var r = el.getBoundingClientRect();
    if (!r.width || !r.height) return;

    var clipped = el.scrollWidth > el.clientWidth + 1 && cs.overflowX !== 'visible' && cs.textOverflow !== 'ellipsis';
    var offscreen = r.right > width + 1 || r.left < -1;

    if (clipped) push('clipped', el, el.scrollWidth + ' > ' + el.clientWidth + 'px' + (cs.whiteSpace === 'nowrap' ? ' (nowrap)' : ''));
    else if (offscreen) push('offscreen', el, Math.round(r.left) + '..' + Math.round(r.right) + 'px vs ' + width);
  });

  /* the sticky bar is fixed, so it is judged on its own terms */
  var satc = doc.querySelector('.satc');
  if (satc) {
    var sr = satc.getBoundingClientRect();
    var btn = satc.querySelector('.btn');
    if (btn && btn.scrollWidth > btn.clientWidth + 1) push('clipped', btn, 'sticky bar button');
    if (sr.width > width + 1) push('offscreen', satc, Math.round(sr.width) + 'px vs ' + width);
  }

  return {
    hscroll: doc.documentElement.scrollWidth > width + 1 ? doc.documentElement.scrollWidth + 'px' : null,
    issues: issues
  };
}

function render (results) {
  var out = document.getElementById('out');
  out.innerHTML = '';
  results.forEach(function (res) {
    var h = document.createElement('h3');
    var count = res.report.issues.length;
    h.innerHTML = res.label + ' — ' + (count ? '<span class="' + (count > 6 ? 'bad' : 'warn') + '">' + count + ' issues</span>' : '<span class="ok">clean</span>') +
      (res.report.hscroll ? ' <span class="bad">· horizontal scroll ' + res.report.hscroll + '</span>' : '');
    out.appendChild(h);
    if (!count) return;
    var rows = res.report.issues;
    var t = document.createElement('table');
    t.innerHTML = '<tr><th>type</th><th>element</th><th>detail</th><th>text</th></tr>' +
      rows.map(function (i) {
        return '<tr><td class="' + (i.type === 'clipped' ? 'bad' : 'warn') + '">' + i.type + '</td><td class="sel">' + i.sel + '</td><td>' + i.detail + '</td><td>' + i.text + '</td></tr>';
      }).join('');
    out.appendChild(t);
  });
  var n = document.createElement('p');
  n.className = 'note';
  n.textContent = 'clipped = content does not fit its own box, this is a real break. offscreen = box sticks past the screen edge. Scrollable rails and off-stage panels (cart drawer, mobile menu, mega menu) are excluded.';
  out.appendChild(n);
}

/* Sweeps every page in the list at every width, off screen, and reports one line per
   page. Meant for "is anything broken anywhere" rather than for looking at a page. */
async function runAll (widths, k, bold) {
  var pages = Array.prototype.slice.call(document.querySelectorAll('#page option'))
    .map(function (o) { return { value: o.value, label: o.textContent.trim() }; })
    .filter(function (o) { return o.value !== '__all__'; });
  var out = document.getElementById('out');
  var rows = [];
  var total = 0;

  for (var p = 0; p < pages.length; p++) {
    out.innerHTML = '<h3>running… ' + (p + 1) + ' of ' + pages.length + ' &mdash; ' + pages[p].label + '</h3>';
    var worst = [];
    var n = 0;
    var scroll = null;
    for (var i = 0; i < widths.length; i++) {
      var w = widths[i];
      var f = document.createElement('iframe');
      f.style.cssText = 'width:' + w + 'px;height:820px;border:0;position:fixed;top:0;left:0;opacity:.01;z-index:-1';
      document.body.appendChild(f);
      f.src = pages[p].value + '?sweep=' + w + '_' + k;
      await new Promise(function (r) { f.onload = r; });
      await new Promise(function (r) { setTimeout(r, 420); });
      try {
        f.contentDocument.querySelectorAll('video').forEach(function (v) { try { v.pause(); } catch (e) {} });
        applyScale(f.contentDocument, k, bold);
        await new Promise(function (r) { setTimeout(r, 180); });
        var rep = audit(f.contentWindow, w);
        n += rep.issues.length;
        if (rep.hscroll) scroll = w + 'px: ' + rep.hscroll;
        rep.issues.forEach(function (is) { worst.push(w + 'px ' + is.type + ' ' + is.sel + ' (' + is.detail + ')'); });
      } catch (e) {
        n += 1; worst.push(w + 'px error ' + e);
      }
      f.remove();
    }
    total += n;
    rows.push({ label: pages[p].label, page: pages[p].value, n: n, scroll: scroll, worst: worst.slice(0, 4) });
  }

  var head = total === 0
    ? '<h3><span class="ok">All ' + pages.length + ' pages clean</span> at ' + widths.join(' / ') + 'px, ' + Math.round(k * 100) + '% text' + (bold ? ', bold' : '') + '</h3>'
    : '<h3><span class="bad">' + total + ' issues</span> across ' + pages.length + ' pages at ' + widths.join(' / ') + 'px, ' + Math.round(k * 100) + '% text' + (bold ? ', bold' : '') + '</h3>';
  var t = '<table><tr><th>page</th><th>result</th><th>first findings</th></tr>' +
    rows.map(function (r) {
      var state = r.n
        ? '<span class="bad">' + r.n + ' issue' + (r.n > 1 ? 's' : '') + '</span>'
        : '<span class="ok">clean</span>';
      if (r.scroll) state += ' <span class="bad">· h-scroll ' + r.scroll + '</span>';
      return '<tr><td class="sel">' + r.label + '</td><td>' + state + '</td><td>' + (r.worst.join('<br>') || '&mdash;') + '</td></tr>';
    }).join('') + '</table>';
  out.innerHTML = head + t +
    '<p class="note">Every page in the list, at every selected width. Scrollable rails and off-stage panels ' +
    '(cart drawer, mobile menu, mega menu) are excluded, the same as in a single-page run.</p>';
}

document.getElementById('run').addEventListener('click', async function () {
  var page = document.getElementById('page').value;
  var widths = document.getElementById('widths').value.split(',').map(Number);
  var k = parseFloat(document.getElementById('scale').value);
  var bold = document.getElementById('bold').checked;
  var frames = document.getElementById('frames');
  frames.innerHTML = '';
  document.getElementById('out').innerHTML = '<h3>running…</h3>';

  if (page === '__all__') { await runAll(widths, k, bold); return; }

  var results = [];
  for (var i = 0; i < widths.length; i++) {
    var w = widths[i];
    var cell = document.createElement('div');
    cell.className = 'cell';
    cell.innerHTML = '<h2>' + w + 'px · ' + Math.round(k * 100) + '%' + (bold ? ' · bold' : '') + '</h2>';
    var f = document.createElement('iframe');
    f.style.width = w + 'px';
    f.src = page + '?stress=' + w + '_' + k;
    cell.appendChild(f);
    frames.appendChild(cell);
    await new Promise(function (r) { f.onload = r; });
    await new Promise(function (r) { setTimeout(r, 500); });
    try {
      f.contentDocument.querySelectorAll('video').forEach(function (v) { try { v.pause(); } catch (e) {} });
      applyScale(f.contentDocument, k, bold);
      await new Promise(function (r) { setTimeout(r, 250); });
      results.push({ label: w + 'px · ' + Math.round(k * 100) + '%' + (bold ? ' · bold' : ''), report: audit(f.contentWindow, w) });
    } catch (e) {
      results.push({ label: w + 'px', report: { hscroll: null, issues: [{ type: 'error', sel: '-', detail: String(e), text: '' }] } });
    }
  }
  render(results);
});
</script>
</body>
</html>
