<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HUSH GLOW — layout stress test</title>
<!-- Internal tool, not a page of the site: kept self-contained on purpose so it never
     pulls the site's shared.css into the measurements. Loads a page in an iframe at a
     set width, multiplies every font-size the way Android's text-scaling setting does
     (font grows, containers do not), and reports what breaks. -->
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#111;color:#eee;font-size:14px;line-height:1.5}
  header{position:sticky;top:0;z-index:5;background:#181818;border-bottom:1px solid #333;padding:14px 18px;display:flex;gap:18px;align-items:center;flex-wrap:wrap}
  h1{font-size:15px;font-weight:600;letter-spacing:.02em}
  label{display:flex;gap:6px;align-items:center;font-size:13px;color:#bbb}
  select,button{font:inherit;background:#262626;color:#eee;border:1px solid #3a3a3a;border-radius:4px;padding:6px 10px;cursor:pointer}
  button.run{background:#2f6b3a;border-color:#2f6b3a;font-weight:600}
  .frames{display:flex;gap:16px;padding:18px;overflow-x:auto;align-items:flex-start}
  .cell{flex:none}
  .cell h2{font-size:12px;color:#9a9a9a;margin-bottom:6px;font-weight:500}
  .cell iframe{border:1px solid #333;background:#fff;height:760px;display:block}
  #out{padding:0 18px 40px;max-width:1100px}
  #out h3{font-size:14px;margin:18px 0 8px;color:#fff}
  table{border-collapse:collapse;width:100%;font-size:12.5px}
  th,td{border-bottom:1px solid #2c2c2c;padding:6px 8px;text-align:left;vertical-align:top}
  th{color:#9a9a9a;font-weight:500}
  td.sel{font-family:ui-monospace,Menlo,monospace;color:#9ecbff}
  .bad{color:#ff8080}
  .warn{color:#ffcf72}
  .ok{color:#8fd694}
  .note{color:#9a9a9a;font-size:12.5px;margin-top:6px}
</style>
</head>
<body>

<header>
  <h1>Layout stress test</h1>
  <label>Page
    <select id="page">
      <option value="product-hush-foundation-cushion.html">Foundation Cushion</option>
      <option value="product-blush-stick.html">Blush Stick</option>
      <option value="index.html">Home</option>
    </select>
  </label>
  <label>Widths
    <select id="widths">
      <option value="320,360,390,430">320 / 360 / 390 / 430</option>
      <option value="360">360 only</option>
      <option value="320">320 only</option>
    </select>
  </label>
  <label>Font scale
    <select id="scale">
      <option value="1">100%</option>
      <option value="1.3" selected>130%</option>
      <option value="1.75">175%</option>
      <option value="2">200%</option>
    </select>
  </label>
  <label><input type="checkbox" id="bold"> Bold text</label>
  <button class="run" id="run">Run audit</button>
</header>

<div class="frames" id="frames"></div>
<div id="out"></div>

<script>
/* Android scales the font only, so the emulation walks the tree and multiplies each
   computed font-size in place. Zooming the iframe would scale boxes too and hide
   exactly the failures we are looking for. */
function applyScale (doc, k, bold) {
  if (k === 1 && !bold) return;
  doc.querySelectorAll('*').forEach(function (el) {
    var cs = doc.defaultView.getComputedStyle(el);
    if (k !== 1) {
      var fs = parseFloat(cs.fontSize);
      if (fs) el.style.fontSize = (fs * k) + 'px';
    }
    if (bold) {
      var w = parseInt(cs.fontWeight, 10) || 400;
      el.style.fontWeight = Math.min(900, w + 300);
    }
  });
}

/* A node counts as broken when its own content does not fit the box it was given, or
   when it sticks out of the viewport. Scrollable rails (sliders, thumb rows) are
   skipped: overflowing is what they are for. */
function audit (win, width) {
  var doc = win.document;
  var rails = ['.thumbs', '.vrow', '.bsrow', '.trow', '.grid3', '.grid4', '.recrow', '.stepgrid', '.shgrid', '.cylrow', '.mm-mtiles', '.ticker', '.pstrip'];
  /* panels that live off-screen until opened would otherwise report as broken layout */
  var offstage = ['.cartdrawer', '.cart-ovl', '.mobmenu', '.mm-panel', '.satc'];
  var isRail = function (el) { return rails.some(function (s) { return el.closest(s); }); };
  var isOffstage = function (el) { return offstage.some(function (s) { return el.closest(s); }); };

  var issues = [];
  var seen = new Set();
  var push = function (type, el, detail) {
    var sel = el.tagName.toLowerCase() + (el.className && typeof el.className === 'string' ? '.' + el.className.trim().split(/\s+/).slice(0, 2).join('.') : '');
    var key = type + '|' + sel;
    if (seen.has(key)) return;
    seen.add(key);
    issues.push({ type: type, sel: sel, detail: detail, text: (el.textContent || '').trim().slice(0, 46) });
  };

  doc.querySelectorAll('body *').forEach(function (el) {
    var cs = win.getComputedStyle(el);
    if (cs.display === 'none' || cs.visibility === 'hidden' || cs.opacity === '0') return;
    if (isOffstage(el) || isRail(el)) return;
    var r = el.getBoundingClientRect();
    if (!r.width || !r.height) return;

    var clipped = el.scrollWidth > el.clientWidth + 1 && cs.overflowX !== 'visible';
    var offscreen = r.right > width + 1 || r.left < -1;

    if (clipped) push('clipped', el, el.scrollWidth + ' > ' + el.clientWidth + 'px' + (cs.whiteSpace === 'nowrap' ? ' (nowrap)' : ''));
    else if (offscreen) push('offscreen', el, Math.round(r.left) + '..' + Math.round(r.right) + 'px vs ' + width);
  });

  /* the sticky bar is fixed, so it is judged on its own terms */
  var satc = doc.querySelector('.satc');
  if (satc) {
    var sr = satc.getBoundingClientRect();
    var btn = satc.querySelector('.btn');
    if (btn && btn.scrollWidth > btn.clientWidth + 1) push('clipped', btn, 'sticky bar button');
    if (sr.width > width + 1) push('offscreen', satc, Math.round(sr.width) + 'px vs ' + width);
  }

  return {
    hscroll: doc.documentElement.scrollWidth > width + 1 ? doc.documentElement.scrollWidth + 'px' : null,
    issues: issues
  };
}

function render (results) {
  var out = document.getElementById('out');
  out.innerHTML = '';
  results.forEach(function (res) {
    var h = document.createElement('h3');
    var count = res.report.issues.length;
    h.innerHTML = res.label + ' — ' + (count ? '<span class="' + (count > 6 ? 'bad' : 'warn') + '">' + count + ' issues</span>' : '<span class="ok">clean</span>') +
      (res.report.hscroll ? ' <span class="bad">· horizontal scroll ' + res.report.hscroll + '</span>' : '');
    out.appendChild(h);
    if (!count) return;
    var rows = res.report.issues;
    var t = document.createElement('table');
    t.innerHTML = '<tr><th>type</th><th>element</th><th>detail</th><th>text</th></tr>' +
      rows.map(function (i) {
        return '<tr><td class="' + (i.type === 'clipped' ? 'bad' : 'warn') + '">' + i.type + '</td><td class="sel">' + i.sel + '</td><td>' + i.detail + '</td><td>' + i.text + '</td></tr>';
      }).join('');
    out.appendChild(t);
  });
  var n = document.createElement('p');
  n.className = 'note';
  n.textContent = 'clipped = content does not fit its own box, this is a real break. offscreen = box sticks past the screen edge. Scrollable rails and off-stage panels (cart drawer, mobile menu, mega menu) are excluded.';
  out.appendChild(n);
}

document.getElementById('run').addEventListener('click', async function () {
  var page = document.getElementById('page').value;
  var widths = document.getElementById('widths').value.split(',').map(Number);
  var k = parseFloat(document.getElementById('scale').value);
  var bold = document.getElementById('bold').checked;
  var frames = document.getElementById('frames');
  frames.innerHTML = '';
  document.getElementById('out').innerHTML = '<h3>running…</h3>';

  var results = [];
  for (var i = 0; i < widths.length; i++) {
    var w = widths[i];
    var cell = document.createElement('div');
    cell.className = 'cell';
    cell.innerHTML = '<h2>' + w + 'px · ' + Math.round(k * 100) + '%' + (bold ? ' · bold' : '') + '</h2>';
    var f = document.createElement('iframe');
    f.style.width = w + 'px';
    f.src = page + '?stress=' + w + '_' + k;
    cell.appendChild(f);
    frames.appendChild(cell);
    await new Promise(function (r) { f.onload = r; });
    await new Promise(function (r) { setTimeout(r, 500); });
    try {
      f.contentDocument.querySelectorAll('video').forEach(function (v) { try { v.pause(); } catch (e) {} });
      applyScale(f.contentDocument, k, bold);
      await new Promise(function (r) { setTimeout(r, 250); });
      results.push({ label: w + 'px · ' + Math.round(k * 100) + '%' + (bold ? ' · bold' : ''), report: audit(f.contentWindow, w) });
    } catch (e) {
      results.push({ label: w + 'px', report: { hscroll: null, issues: [{ type: 'error', sel: '-', detail: String(e), text: '' }] } });
    }
  }
  render(results);
});
</script>
</body>
</html>
